<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Değişim Menüsü</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --surface-2:#F6F9F7; --line:#D6E0DA;
  --ink:#15241D; --muted:#5A6B62; --accent:#1C6E4C; --accent-ink:#FFFFFF; --accent-soft:#DCEEE4;
  --warn:#9A4A10; --warn-soft:#FBEBDD; --ok:#1C6E4C;
  --g-et:#B0472F; --g-sut:#2F6DB5; --g-sebze:#3F8A2E; --g-meyve:#C27A12; --g-ekmek:#86643A; --g-yag:#7461AE; --g-serbest:#6B7C73;
  --shadow:0 10px 40px rgba(20,40,30,.18);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1714; --surface:#17221D; --surface-2:#1C2923; --line:#2A3A32;
    --ink:#E4EEE8; --muted:#94A69C; --accent:#5CC393; --accent-ink:#0B1A13; --accent-soft:#1D3A2C;
    --warn:#F0A868; --warn-soft:#3A2717;
    --g-et:#E27C63; --g-sut:#6FA5E6; --g-sebze:#7CC46A; --g-meyve:#E8A948; --g-ekmek:#C39A68; --g-yag:#A897E0; --g-serbest:#8FA198;
    --shadow:0 10px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1714; --surface:#17221D; --surface-2:#1C2923; --line:#2A3A32;
  --ink:#E4EEE8; --muted:#94A69C; --accent:#5CC393; --accent-ink:#0B1A13; --accent-soft:#1D3A2C;
  --warn:#F0A868; --warn-soft:#3A2717;
  --g-et:#E27C63; --g-sut:#6FA5E6; --g-sebze:#7CC46A; --g-meyve:#E8A948; --g-ekmek:#C39A68; --g-yag:#A897E0; --g-serbest:#8FA198;
  --shadow:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:24px;font-weight:700}
.brand small{color:var(--muted);font-size:13px}
.profiles{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;display:flex;align-items:center;gap:8px}
.pbtn .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pbtn[aria-pressed="true"] .dot{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

.owner{margin:16px 0 0;color:var(--muted);font-size:13px;font-weight:500}
/* totals */
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-block:18px 8px;flex-wrap:wrap}
.day h2{font-size:18px}
.day .meta{color:var(--muted);font-size:13px}
.totals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.totals{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.tot b{font-family:var(--f-display);font-size:22px;line-height:1}
.tot span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.tot span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.alert{margin-top:10px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500}

/* meals */
.meals{display:grid;gap:14px;margin-top:18px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 8px;flex-wrap:wrap}
.meal-h h3{font-size:18px}
.meal-h .time{color:var(--muted);font-size:13px}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:14px;height:14px}
.item.done .what{opacity:.5;text-decoration:line-through}
.what{display:grid;gap:3px;min-width:0}
.food{font-weight:600}
.food .amt{font-weight:500;color:var(--muted)}
.food .star{color:var(--g-meyve)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.chip .n{color:var(--muted)}
.swapped{font-size:11px;color:var(--accent);font-weight:600;text-transform:none;letter-spacing:0}
.free .food{font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:18px}
.empty p{margin:0;color:var(--muted);max-width:44ch}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;border-radius:18px 18px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet-h{padding:16px 16px 10px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:20px}
.sheet-h p{margin:0;color:var(--muted);font-size:13px}
.meter{display:flex;gap:4px;margin-top:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--c)}
.meter i.over{background:var(--warn)}
.sheet-b{overflow-y:auto;padding:4px 0}
.opt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.opt.sel{background:var(--surface-2)}
.opt .nm{font-weight:600;background:none;border:0;padding:0;text-align:left}
.opt .nm:hover{color:var(--accent)}
.opt .sub{font-size:13px;color:var(--muted)}
.opt .cur{font-size:13px;color:var(--accent);font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px;padding:0}
.step output{min-width:22px;text-align:center;font-weight:700}
.sheet-f{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .right{display:flex;gap:8px}
.hint{font-size:12px;color:var(--muted)}

/* tables tab */
.explain{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px;display:grid;gap:8px}
.explain h2{font-size:18px}
.explain p{margin:0;color:var(--muted);max-width:68ch}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.gtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.gtab::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.gtab[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.tbl-wrap{overflow-x:auto;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tnote{font-size:13px;color:var(--muted);margin:10px 2px 0}

/* rules tab */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start}
.card h2{font-size:17px}
.card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.card.no h2{color:var(--warn)}

/* edit tab */
.form{display:grid;gap:14px;margin-top:18px}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:120px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.erow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.erow .what{font-size:14px}
.emeal-h{display:grid;grid-template-columns:1fr 150px auto;gap:8px;padding:12px 14px}
@media (max-width:520px){.emeal-h{grid-template-columns:1fr 1fr}.emeal-h .btn{grid-column:1/-1}}
.add{display:grid;grid-template-columns:1fr 90px 1fr auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
@media (max-width:560px){.add{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:30}
.sync{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Değişim Menüsü</h1>
      <small id="sync" class="sync">Bu cihazda kayıtlı</small>
    </div>
    <div class="profiles" id="profiles" role="group" aria-label="Profiller"></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="menu">Menü</button>
      <button class="tab" role="tab" data-tab="tables">Değişim tabloları</button>
      <button class="tab" role="tab" data-tab="rules">Kurallar</button>
      <button class="tab" role="tab" data-tab="edit">Profili düzenle</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="sheet-root"></div>

<script>

let saveTimer = null;
function save(){
  S.updated = Date.now();

(async ()=>{

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = () => S.profiles[S.active];
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const FR = [[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[3/8,"⅜"],[1/2,"½"],[5/8,"⅝"],[2/3,"⅔"],[3/4,"¾"],[7/8,"⅞"]];
function fmtNum(x){
  const w = Math.floor(x+1e-9), r = x - w;
  if(r < 0.02) return String(w);
  if(r > 0.98) return String(w+1);
  const hit = FR.find(([v])=>Math.abs(v-r)<0.02);
  if(hit) return (w? w+" ":"") + hit[1];
  return (Math.round(x*10)/10).toString().replace(".",",");
}
function amount(f, units){
  const q = Array.isArray(f.n) ? f.n.map(v=>fmtNum(v*units)).join("-") : fmtNum(f.n*units);
  let extra = "";
  if(f.g) extra = " · " + fmtNum(f.g*units) + " g";
  else if(f.ml) extra = " · " + fmtNum(f.ml*units) + " ml";
  return q + " " + f.u + extra;
}
function portions(it){ return it.sel || it.def; }
function isSwapped(it){ return !!it.sel; }
function gcolor(k){ return "var("+GROUPS[k].color+")"; }
function totals(p){
  const t = {}; GKEYS.forEach(k=>t[k]=0);
  let gi = 0;
  p.meals.forEach(m=>m.items.forEach(it=>{
    if(it.kind!=="ex") return;
    t[it.group]+=it.units;
    portions(it).forEach(x=>{ const f=FOOD[it.group+":"+x.f]; if(f&&f.gi) gi+=x.u; });
  }));
  return {t, gi};
}
function toast(msg){
  const el = document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),1800);
}

/* ---------- swap sheet ---------- */
let SW = null; // {mid, iid, counts:{}}
function findItem(iid){ for(const m of P().meals){ const it=m.items.find(x=>x.id===iid); if(it) return {m,it}; } return null; }
function openSwap(iid){
  const r = findItem(iid); if(!r) return;
  const counts = {}; portions(r.it).forEach(x=>counts[x.f]=(counts[x.f]||0)+x.u);
  SW = {iid, counts, step: r.it.units % 1 ? .5 : 1};
  renderSheet();
}
function renderSheet(){
  const root = $("#sheet-root");
  if(!SW){ root.innerHTML=""; return; }
  const {it, m} = findItem(SW.iid); const G = GROUPS[it.group];
  const used = Object.values(SW.counts).reduce((a,b)=>a+b,0);
  const left = it.units - used;
  const segs = Math.max(it.units, used) / SW.step;
  let meter = ""; for(let i=0;i<segs;i++){ const v=(i+1)*SW.step; meter += `<i class="${v<=used+1e-9 ? (v>it.units+1e-9?"over":"on") : ""}"></i>`; }
  const status = Math.abs(left)<1e-9 ? "Tamam, değişimler dengede." : left>0 ? `${fmtNum(left)} değişim daha seç.` : `${fmtNum(-left)} değişim fazla.`;
  root.innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Değiştir" style="--c:${gcolor(it.group)}">
    <div class="sheet-h"><span class="chip" style="--c:${gcolor(it.group)}">${esc(m.name)} · ${G.name}</span>
      <h3>${fmtNum(it.units)} ${G.long}</h3>
      <p>Bir besine dokun: hepsi onunla değişir. Ya da +/− ile birkaç besine böl.${it.orig?` Listede: ${esc(it.orig)}.`:""}</p>
      <div class="meter" aria-hidden="true">${meter}</div>
      <p class="tnum" role="status">${status}</p></div>
    <div class="sheet-b">${G.foods.map(f=>{
      const c = SW.counts[f.id]||0;
      return `<div class="opt ${c?"sel":""}"><div><button class="nm" data-all="${f.id}">${esc(f.name)}${f.gi?' <span style="color:var(--g-meyve)">*</span>':""}</button>
        <div class="sub tnum">1 değişim: ${esc(amount(f,1))}</div>
        ${c?`<div class="cur tnum">Seçili: ${esc(amount(f,c))}</div>`:""}</div>
        <div class="step"><button data-dec="${f.id}" aria-label="${esc(f.name)} azalt" ${c?"":"disabled"}>−</button><output class="tnum">${fmtNum(c)}</output><button data-inc="${f.id}" aria-label="${esc(f.name)} artır">+</button></div></div>`;
    }).join("")}</div>
    <div class="sheet-f"><button class="btn ghost" data-swapreset="1">Listedeki haline dön</button>
      <div class="right"><button class="btn" data-close="1">Vazgeç</button><button class="btn primary" data-swapsave="1" ${Math.abs(left)<1e-9?"":"disabled"}>Kaydet</button></div></div>
  </div></div>`;
}
function saveSwap(){
  const {it} = findItem(SW.iid);
  const sel = Object.entries(SW.counts).filter(([,u])=>u>0).map(([f,u])=>({f,u}));
  const same = sel.length===it.def.length && sel.every(x=>it.def.some(d=>d.f===x.f && d.u===x.u));
  it.sel = same ? null : sel;
  SW = null; save(); renderSheet(); render(); toast("Değişim kaydedildi");
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("button, .scrim"); if(!b) return;
  const d = b.dataset;
  if(b.classList.contains("scrim") && e.target!==b) return;
  if(d.close){ SW=null; renderSheet(); return; }
  if(d.profile){ S.active=d.profile; confirmKey=null; save(); render(); return; }
  if(d.tab){ TAB=d.tab; confirmKey=null; try{localStorage.setItem("degisim-tab",TAB)}catch(e){} render(); return; }
  if(d.go){ TAB=d.go; render(); return; }
  if(d.gtab){ GTAB=d.gtab; render(); return; }
  if(d.check){ const k=todayKey(); const p=P(); p.log={[k]:p.log[k]||{}}; p.log[k][d.check]=!p.log[k][d.check]; if(!p.log[k][d.check]) delete p.log[k][d.check]; save(); render(); return; }
  if(d.swap){ openSwap(d.swap); return; }
  if(d.all){ const {it}=findItem(SW.iid); SW.counts={[d.all]:it.units}; renderSheet(); return; }
  if(d.inc){ SW.counts[d.inc]=(SW.counts[d.inc]||0)+SW.step; renderSheet(); return; }
  if(d.dec){ SW.counts[d.dec]=Math.max(0,(SW.counts[d.dec]||0)-SW.step); renderSheet(); return; }
  if(d.swapreset){ const {it}=findItem(SW.iid); SW.counts={}; it.def.forEach(x=>SW.counts[x.f]=x.u); renderSheet(); return; }
  if(d.swapsave){ saveSwap(); return; }
  if(d.delmeal){ if(confirmKey!=="meal:"+d.delmeal){ confirmKey="meal:"+d.delmeal; render(); return; } P().meals=P().meals.filter(m=>m.id!==d.delmeal); confirmKey=null; save(); render(); return; }
  if(d.delitem){ const [mid,iid]=d.delitem.split("|"); const m=P().meals.find(x=>x.id===mid); m.items=m.items.filter(x=>x.id!==iid); save(); render(); return; }
  if(d.additem){
    const mid=d.additem, g=$("#ag-"+mid).value, u=parseFloat($("#au-"+mid).value), fv=$("#af-"+mid).value.trim();
    const m=P().meals.find(x=>x.id===mid);
    if(g==="free"){ if(!fv){ toast("Önce metni yaz"); return; } m.items.push(fr(fv)); }
    else m.items.push(ex(g,u,fv));
    save(); render(); toast("Eklendi"); return;
  }
  if(d.act==="addmeal"){ P().meals.push({id:nid("m"),name:"Yeni öğün",time:"",items:[]}); save(); render(); return; }
  if(d.act==="reset"){ if(confirmKey!=="reset"){ confirmKey="reset"; render(); return; } P().meals=berkayPlan(); confirmKey=null; save(); render(); toast("Diyetisyen listesine dönüldü"); return; }
  if(d.act==="copy-berkay"){
    if(P().meals.length && confirmKey!=="copy"){ confirmKey="copy"; render(); return; }
    P().meals = JSON.parse(JSON.stringify(S.profiles.p1.meals)).map(m=>({...m,id:nid("m"),items:m.items.map(it=>({...it,id:nid()}))}));
    confirmKey=null; save(); render(); toast("Liste kopyalandı"); return;
  }
  if(d.act==="clearswaps"){ P().meals.forEach(m=>m.items.forEach(it=>{ if(it.kind==="ex") it.sel=null; })); save(); render(); toast("Tüm değişimler geri alındı"); return; }
  if(d.act==="export"){ const ta=$("#io"); ta.value=JSON.stringify(S); ta.select();
    try{ navigator.clipboard.writeText(ta.value).then(()=>toast("Kopyalandı"),()=>toast("Metin seçildi, kopyala")); }catch(err){ toast("Metin seçildi, kopyala"); } return; }
  if(d.act==="import"){ try{ const o=JSON.parse($("#io").value); if(!o.profiles||!o.profiles.p1) throw 0; S=o; save(); render(); toast("İçe aktarıldı"); }catch(err){ toast("Metin okunamadı. Yedeğin tamamını yapıştır."); } return; }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="pname"){ P().name = t.value.trim() || "Profil"; save(); render(); }
  else if(t.id==="pfull"){ P().fullName = t.value.trim(); save(); }
  else if(t.id==="psrc"){ P().source = t.value.trim(); save(); }
  else if(t.dataset.mname){ P().meals.find(m=>m.id===t.dataset.mname).name=t.value; save(); }
  else if(t.dataset.mtime){ P().meals.find(m=>m.id===t.dataset.mtime).time=t.value; save(); }
  else if(t.dataset.addgroup){ $("#af-wrap-"+t.dataset.addgroup).innerHTML = foodSelect(t.dataset.addgroup, t.value); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && SW){ SW=null; renderSheet(); } });

render();
</script>
</body>
</html>
