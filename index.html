<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Değişim Menüsü</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --surface-2:#F6F9F7; --line:#D6E0DA;
  --ink:#15241D; --muted:#5A6B62; --accent:#1C6E4C; --accent-ink:#FFFFFF; --accent-soft:#DCEEE4;
  --warn:#9A4A10; --warn-soft:#FBEBDD; --ok:#1C6E4C;
  --g-et:#B0472F; --g-sut:#2F6DB5; --g-sebze:#3F8A2E; --g-meyve:#C27A12; --g-ekmek:#86643A; --g-yag:#7461AE; --g-serbest:#6B7C73;
  --shadow:0 10px 40px rgba(20,40,30,.18);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1714; --surface:#17221D; --surface-2:#1C2923; --line:#2A3A32;
    --ink:#E4EEE8; --muted:#94A69C; --accent:#5CC393; --accent-ink:#0B1A13; --accent-soft:#1D3A2C;
    --warn:#F0A868; --warn-soft:#3A2717;
    --g-et:#E27C63; --g-sut:#6FA5E6; --g-sebze:#7CC46A; --g-meyve:#E8A948; --g-ekmek:#C39A68; --g-yag:#A897E0; --g-serbest:#8FA198;
    --shadow:0 10px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1714; --surface:#17221D; --surface-2:#1C2923; --line:#2A3A32;
  --ink:#E4EEE8; --muted:#94A69C; --accent:#5CC393; --accent-ink:#0B1A13; --accent-soft:#1D3A2C;
  --warn:#F0A868; --warn-soft:#3A2717;
  --g-et:#E27C63; --g-sut:#6FA5E6; --g-sebze:#7CC46A; --g-meyve:#E8A948; --g-ekmek:#C39A68; --g-yag:#A897E0; --g-serbest:#8FA198;
  --shadow:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:24px;font-weight:700;flex:none}
.brand small{color:var(--muted);font-size:13px;min-width:0;text-align:right;line-height:1.3;overflow-wrap:anywhere}
.profiles{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;display:flex;align-items:center;gap:8px}
.pbtn .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pbtn[aria-pressed="true"] .dot{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .sm{display:none}

.owner{margin:16px 0 0;color:var(--muted);font-size:13px;font-weight:500}
/* totals */
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-block:18px 8px;flex-wrap:wrap}
.day h2{font-size:18px}
.day .meta{color:var(--muted);font-size:13px}
.totals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.totals{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.tot b{font-family:var(--f-display);font-size:22px;line-height:1}
.tot span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.tot span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.tot .lim{font-size:13px;font-weight:500;color:var(--muted)}
.limnote{margin:8px 2px 0}
.mroom{margin:0;padding:8px 14px 0;border-top:1px solid var(--line)}
.improw{display:grid;gap:4px;padding:10px 14px;border-top:1px solid var(--line)}
.improw.check{background:var(--warn-soft)}
.qwarn{margin-top:10px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:grid;gap:8px;font-size:13px}
.qwarn>b{color:var(--warn)}
.qwarn ul{margin:0;padding-left:18px;display:grid;gap:4px}
.qwarn p{margin:0;color:var(--muted)}
.qphoto{display:grid;gap:6px}
.qnum{font-weight:600}
.qcrops{display:grid;gap:6px}
.qmore summary{cursor:pointer;font-weight:600;color:var(--warn)}
.qmore .qcrops{margin-top:6px}
.qcrops img{display:block;max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.impc{display:grid;grid-template-columns:110px 80px 1fr auto;gap:8px;align-items:stretch}
.impc input[type=text]{grid-column:span 2}
@media (max-width:560px){.impc{grid-template-columns:1fr 84px auto}.impc select[data-impf],.impc input[type=text]{grid-column:1/-1;order:3}.impc.free select{grid-column:1/3}}
details.card summary{cursor:pointer;font-weight:600}
progress{accent-color:var(--accent);height:10px}
.alert{margin-top:10px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500}

/* meals */
.meals{display:grid;gap:14px;margin-top:18px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 8px;flex-wrap:wrap}
.meal-h h3{font-size:18px}
.meal-h .time{color:var(--muted);font-size:13px}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
button.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0;position:relative}
button.check::after{content:"";position:absolute;inset:-9px}
button.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.check svg{width:14px;height:14px}
.item.done .what{opacity:.5;text-decoration:line-through}
.what{display:grid;gap:3px;min-width:0}
.food{font-weight:600}
.food .amt{font-weight:500;color:var(--muted)}
.food .star{color:var(--g-meyve)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.chip .n{color:var(--muted)}
.swapped{font-size:11px;color:var(--accent);font-weight:600;text-transform:none;letter-spacing:0}
.free .food{font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:18px}
.empty p{margin:0;color:var(--muted);max-width:44ch}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;max-height:88dvh;border-radius:18px 18px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet-h{padding:16px 16px 10px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:20px}
.sheet-h p{margin:0;color:var(--muted);font-size:13px}
.meter{display:flex;gap:4px;margin-top:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--c)}
.meter i.over{background:var(--warn)}
.sheet-b{overflow-y:auto;padding:4px 0}
.opt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.opt.sel{background:var(--surface-2)}
.opt .nm{font-weight:600;background:none;border:0;padding:0;text-align:left}
.opt .nm:hover{color:var(--accent)}
.opt .sub{font-size:13px;color:var(--muted)}
.opt .cur{font-size:13px;color:var(--accent);font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px;padding:0}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:22px;text-align:center;font-weight:700}
.sheet-f{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .right{display:flex;gap:8px}
.hint{font-size:12px;color:var(--muted)}

/* tables tab */
.explain{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px;display:grid;gap:8px}
.explain h2{font-size:18px}
.explain p{margin:0;color:var(--muted);max-width:68ch}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.gtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.gtab::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.gtab[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.tbl-wrap{overflow-x:auto;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){th,td{padding:8px 10px}td.num{white-space:normal}th:first-child{width:38%}}
.tnote{font-size:13px;color:var(--muted);margin:10px 2px 0}

/* rules tab */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start}
.card h2{font-size:17px}
.card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.card.no h2{color:var(--warn)}

/* edit tab */
.form{display:grid;gap:14px;margin-top:18px}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:120px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.erow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.erow .what{font-size:14px}
.emeal-h{display:grid;grid-template-columns:1fr 150px;gap:8px;padding:12px 14px}
.add{display:grid;grid-template-columns:1fr 90px 1fr auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
@media (max-width:560px){.add{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:30}
.sync{font-size:12px;color:var(--muted)}
.account{display:flex;align-items:center;justify-content:space-between;gap:8px}
.account .who{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.account .btn{flex:none}
.whot{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account .who .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);flex:none}
.account .mail{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.auth{max-width:420px;margin:24px auto 0}
.choices{display:grid;gap:8px}
.choice{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px}
.choice b{font-weight:600}
.choice span{font-size:13px;color:var(--muted)}
button.choice:hover{border-color:var(--accent)}
div.choice{gap:8px}
div.choice .field{margin-top:4px}
div.choice .btn{justify-self:start}
@media (prefers-reduced-motion:no-preference){.sheet.enter{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* telefon: iOS 16px altındaki yazı kutusuna dokununca sayfayı yakınlaştırır */
@media (pointer:coarse), (max-width:760px){input,select,textarea{font-size:16px}}
@media (max-width:560px), (max-height:500px){
  .top{top:calc(env(safe-area-inset-top,0px) - var(--top-hide,0px))}  /* kaydırınca başlık ve hesap satırı çekilir, sekmeler kalır */
  .top:has(.account :focus-visible){top:env(safe-area-inset-top,0px)}  /* klavyeyle "Çıkış yap"a gelinince görünsün */
}
@media (max-width:480px){
  .brand h1{font-size:21px}
  .whot{display:grid;line-height:1.3}
  .whot>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab{flex:1 1 auto;padding:6px 8px}
  .tab .lg{display:none}
  .tab .sm{display:inline}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Değişim Menüsü</h1>
      <small id="sync" class="sync" role="status"></small>
    </div>
    <div class="account" id="account"></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="menu">Menü</button>
      <button class="tab" role="tab" data-tab="tables"><span class="lg">Değişim tabloları</span><span class="sm">Tablolar</span></button>
      <button class="tab" role="tab" data-tab="rules">Kurallar</button>
      <button class="tab" role="tab" data-tab="edit"><span class="lg">Profili düzenle</span><span class="sm">Profil</span></button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="sheet-root"></div>
<input type="file" id="impfile" accept="image/*" multiple hidden>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   DEĞİŞİM SİSTEMİ
   Diyet listesi yemek adıyla değil "değişim" (porsiyon eşdeğeri)
   sayısıyla kurulur. Aynı gruptaki her besinin 1 değişimi aynı
   enerji/makro değerini taşır; bu yüzden bir öğündeki 3 ekmek
   değişimi, 3 dilim ekmek yerine 6 yemek kaşığı pilav ya da 1 dilim ekmek +
   4 yemek kaşığı pilav olarak yenebilir. Gruplar arası değişim yapılmaz.
   Miktarlar diyetisyen listesindeki tablolardan alınmıştır.
   ============================================================ */
const GROUPS = {
  et:{name:"Et",long:"Et değişimi",color:"--g-et",info:"Protein grubu. 1 değişim ≈ 30 g pişmiş et, 1 yumurta veya 1 kibrit kutusu beyaz peynir.",
    foods:[
      {id:"kofte",name:"Köfte",n:1,u:"yumurta büyüklüğü",g:30},
      {id:"kiyma",name:"Kıyma",n:1,u:"köfte büyüklüğü",g:30},
      {id:"kusbasi",name:"Kuşbaşı et",n:[3,4],u:"parça",g:30},
      {id:"pirzola",name:"Pirzola",n:1,u:"adet",g:30},
      {id:"biftek",name:"Biftek",n:1,u:"orta büyüklükte",g:30},
      {id:"tavuk",name:"Tavuk / Hindi",n:1,u:"köfte büyüklüğü",g:30},
      {id:"balik",name:"Balık",n:1,u:"köfte kadar",g:30},
      {id:"ton",name:"Ton balığı (light)",n:1,u:"köfte kadar",g:40},
      {id:"yumurta",name:"Yumurta",n:1,u:"adet",g:50},
      {id:"beyaz",name:"Beyaz peynir",n:1,u:"kibrit kutusu kadar",g:30},
      {id:"kasar",name:"Kaşar peyniri",n:2/3,u:"kibrit kutusu kadar",g:20},
      {id:"cokelek",name:"Çökelek",n:1,u:"yemek kaşığı",g:30},
      {id:"lor",name:"Lor peyniri",n:4,u:"yemek kaşığı",g:40},
      {id:"lightkasar",name:"Light kaşar",n:1,u:"kibrit kutusu kadar",g:30}
    ]},
  sut:{name:"Süt",long:"Süt değişimi",color:"--g-sut",info:"1 değişim = 1 su bardağı süt. Ayran sulandırıldığı için 2 bardak = 1 değişim.",
    foods:[
      {id:"sut",name:"Süt",n:1,u:"su bardağı",ml:200},
      {id:"yogurt",name:"Yoğurt",n:4,u:"yemek kaşığı",note:"listede 1 su bardağı / 200 g olarak da geçer"},
      {id:"ayran",name:"Ayran",n:2,u:"su bardağı",ml:400},
      {id:"kefir",name:"Kefir",n:1,u:"su bardağı",ml:200}
    ]},
  sebze:{name:"Sebze",long:"Sebze değişimi",color:"--g-sebze",info:"Çiğ sebzeler yağsız olarak serbesttir. Pişmiş sebze yemeği 4 yemek kaşığı = 1 porsiyon.",
    foods:[
      {id:"sebzeyemegi",name:"Pişmiş sebze yemeği",n:4,u:"yemek kaşığı"},
      {id:"havuc",name:"Havuç",n:1,u:"orta boy",g:100},
      {id:"havucsuyu",name:"Havuç suyu",n:.5,u:"su bardağı",ml:120}
    ]},
  meyve:{name:"Meyve",long:"Meyve değişimi",color:"--g-meyve",info:"Tablodaki miktarlar 1 porsiyondur. * işaretli meyveler kan şekerini hızlı yükseltir: günde en fazla 1 porsiyon.",
    foods:[
      {id:"elma",name:"Elma",n:1,u:"küçük boy",g:100},
      {id:"armut",name:"Armut",n:1,u:"orta boy",g:100},
      {id:"portakal",name:"Portakal",n:1,u:"orta boy",g:100},
      {id:"mandalina",name:"Mandalina",n:1,u:"büyük boy",g:100},
      {id:"greyfurt",name:"Greyfurt",n:.5,u:"adet",g:125},
      {id:"muz",name:"Muz",n:1,u:"küçük boy",g:50,gi:true},
      {id:"incir",name:"Taze incir",n:1,u:"adet",g:80,gi:true},

const BERKAY_EMAIL_SHA256 = "35c5d99188cdb952a46730a75dfd3f225dca379757b7d8b8012ed5d25521586f";
let IS_BERKAY = false;
async function sha256hex(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

const MEAL_KEYS = {"sabah":"sabah","öğle":"ogle","akşam":"aksam","gece · spor sonrası":"gece"};
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const okNum = x => typeof x==="number" && isFinite(x) && x > 0;
function migrateProfile(p){
  if(!p) return;
  p.meals = Array.isArray(p.meals) ? p.meals.filter(m=>m && typeof m==="object") : []; p.log = (p.log && typeof p.log==="object") ? p.log : {};
  if(typeof p.name!=="string" || !p.name.trim()) p.name = "Profilim";
  // id'ler HTML özniteliğine yazılıyor; beklenmedik karakter içerenleri yenile
  const safeId = x => typeof x==="string" && /^[A-Za-z0-9_-]{1,40}$/.test(x);
  p.meals.forEach(m=>{ if(!safeId(m.id)) m.id = nid("m"); if(m.key!==undefined && !safeId(m.key)) delete m.key; m.name = String(m.name||""); m.time = String(m.time||"");
    (Array.isArray(m.items)?m.items:[]).forEach(it=>{ if(it && !safeId(it.id)) it.id = nid(); }); });
  // bozuk kalemleri ve toplamı tutmayan değişim seçimlerini ayıkla
  p.meals.forEach(m=>{
    m.items = (Array.isArray(m.items) ? m.items : []).filter(it=> it && (it.kind==="free" ? typeof it.text==="string"
      : it.kind==="ex" && own(GROUPS, it.group) && okNum(it.units) && Array.isArray(it.def) && it.def.length
        && it.def.every(x=>x && FOOD[it.group+":"+x.f] && okNum(x.u)) && Math.abs(it.def.reduce((a,x)=>a+x.u,0)-it.units) < 1e-9));
    m.items.forEach(it=>{ if(it.kind!=="ex" || !it.sel) return;
      const ok = Array.isArray(it.sel) && it.sel.length && it.sel.every(x=>x && FOOD[it.group+":"+x.f] && okNum(x.u)) && Math.abs(it.sel.reduce((a,x)=>a+x.u,0)-it.units) < 1e-9;
      if(!ok) it.sel = null; });
  });
  if(p.plan==="berkay" && !(p.diet && Array.isArray(p.diet.meals))) p.diet = {meals: berkayPlan(), at: 0};
  if(!(p.diet && Array.isArray(p.diet.meals))){ delete p.diet; return; }
  const plan = p.diet.meals.filter(m=>m && m.key && Array.isArray(m.items));
  p.diet.meals = plan;
  const lim = dietLimits(p);
  // öğün limitleri key ile bulunur. Geçersiz/tekrarlı key'leri sil; key'siz öğünleri
  // önce adla, sonra saatle, sonra içeriği listedeki tek bir öğüne sığıyorsa onunla eşleştir.
  const used = new Set();
  p.meals.forEach(m=>{ if(m.key && (!lim.perMeal[m.key] || used.has(m.key))) delete m.key; if(m.key) used.add(m.key); });
  const give = (m, k) => { if(k && lim.perMeal[k] && !used.has(k)){ m.key = k; used.add(k); } };
  const norm = x => String(x||"").trim().toLocaleLowerCase("tr");
  p.meals.forEach(m=>{ if(!m.key) give(m, (plan.find(x=>norm(x.name)===norm(m.name))||{}).key || (own(MEAL_KEYS, norm(m.name)) ? MEAL_KEYS[norm(m.name)] : null)); });
  p.meals.forEach(m=>{ if(!m.key && m.time) give(m, (plan.find(x=>norm(x.time)===norm(m.time))||{}).key); });
  // içerik eşleşmesi: yalnız tek bir boş öğüne sığan öğüne ver; her atamadan sonra yeniden dene
  for(let changed = true; changed; ){
    changed = false;
    p.meals.forEach(m=>{
      if(m.key || !m.items.some(it=>it.kind==="ex")) return;
      const mt = mealTotals(m);
      const fits = plan.map(x=>x.key).filter(k=>!used.has(k) && GKEYS.every(g=>mt[g] <= lim.perMeal[k][g] + 1e-9));
      if(fits.length===1){ give(m, fits[0]); changed = true; }
    });
  }
}

  let local = null; try{ local = readProfile(localStorage.getItem(cacheKey(u))||"null"); }catch(e){}

    const snap = await fsdb.collection("users").doc(u.uid).get();
    if(USER!==u) return;
    const remote = snap.exists ? readProfile((snap.data()||{}).json) : null;
    if(remote && !(local && (local.updated||0) > (remote.updated||0))){
      ME = remote; setSync("Hesabına kayıtlı");
      try{ localStorage.setItem(cacheKey(u), JSON.stringify(remote)); }catch(e){}   // cihazdaki eski kopya yenisinin üstüne yazmasın

const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const FR = [[1/16,"1/16"],[1/8,"⅛"],[1/6,"⅙"],[3/16,"3/16"],[1/4,"¼"],[5/16,"5/16"],[1/3,"⅓"],[3/8,"⅜"],[7/16,"7/16"],[1/2,"½"],[9/16,"9/16"],[5/8,"⅝"],[2/3,"⅔"],[11/16,"11/16"],[3/4,"¾"],[13/16,"13/16"],[5/6,"⅚"],[7/8,"⅞"],[15/16,"15/16"]];
function fmtNum(x){
  const w = Math.floor(x+1e-9), r = x - w;
  if(r < 0.01) return String(w);
  if(r > 0.99) return String(w+1);
  const hit = FR.reduce((b,e)=>Math.abs(e[0]-r) < Math.abs(b[0]-r) ? e : b);
  if(Math.abs(hit[0]-r) < 0.01) return (w? w+" ":"") + hit[1];
  return fmtDec(x);
}
// gram ve ml kesirle değil ondalıkla yazılır: 12,5 g
const fmtDec = x => (Math.round(x*10)/10).toString().replace(".",",");
function amount(f, units){
  const q = Array.isArray(f.n) ? f.n.map(v=>fmtNum(v*units)).join("-") : fmtNum(f.n*units);
  let extra = "";
  if(f.g) extra = " · " + fmtDec(f.g*units) + " g";
  else if(f.ml) extra = " · " + fmtDec(f.ml*units) + " ml";
  return q + " " + f.u + extra;
}
// tablo hücresi: dar ekranda "30" ile "g" ayrı satıra düşmesin (yalnız boşluklar bölünmez olur, metin aynı)
function tblAmt(f, units){ return esc(amount(f, units)).replace(/([\d½¼¾⅓⅔]) (?=\S)/g, "$1\u00a0").replace(/ · /g, "\u00a0· "); }
function portions(it){ return it.sel || it.def; }
function isSwapped(it){ return !!it.sel; }

function totals(p){
  const t = {}; GKEYS.forEach(k=>t[k]=0);
  let gi = 0;
  p.meals.forEach(m=>m.items.forEach(it=>{
    if(it.kind!=="ex") return;
    t[it.group]+=it.units;
    portions(it).forEach(x=>{ const f=FOOD[it.group+":"+x.f]; if(f&&f.gi) gi+=x.u; });
  }));
  return {t, gi};
}
/* ---------- limitler ----------
   Berkay Er'in listesindeki değişim sayıları üst sınırdır, hem öğün
   öğün hem günlük: Et 9, Süt 2, Sebze 2, Meyve 2, Ekmek 12, Yağ 1.
   Kalem eklenerek, öğünler arasında kaydırılarak ya da değiştirme
   ekranında fazla seçilerek aşılamaz. * işaretli meyveler her profilde
   günde en fazla 1 porsiyon. */
const zeroT = () => { const t={}; GKEYS.forEach(k=>t[k]=0); return t; };
function mealTotals(m){ const t=zeroT(); m.items.forEach(it=>{ if(it.kind==="ex") t[it.group]+=it.units; }); return t; }
// limitler profilin kayıtlı diyetisyen listesinden (p.diet) hesaplanır
const LIM_CACHE = new WeakMap();
function dietLimits(p){
  const d = p && p.diet; if(!d || !Array.isArray(d.meals)) return null;
  if(LIM_CACHE.has(d)) return LIM_CACHE.get(d);
  const perMeal = Object.create(null), daily = zeroT();
  d.meals.forEach(m=>{ if(!m.key) return; const t = mealTotals(m); perMeal[m.key] = t; GKEYS.forEach(k=>daily[k]+=t[k]); });
  const r = {perMeal, daily}; LIM_CACHE.set(d, r); return r;
}
const GI_MAX = 1;
const isLocked = p => !!dietLimits(p);
const limitsOf = p => isLocked(p) ? dietLimits(p).daily : null;
// listede olmayan (sonradan eklenen) öğüne değişim eklenemez, sadece serbest kalem
const mealLimitsOf = (p, m) => { const L = dietLimits(p); return L ? (m.key && L.perMeal[m.key] ? L.perMeal[m.key] : zeroT()) : null; };
function overLimits(p){
  const L = limitsOf(p); if(!L) return [];
  const {t} = totals(p);
  const out = GKEYS.filter(k=>t[k] > L[k] + 1e-9).map(k=>`Günlük ${GROUPS[k].name.toLocaleLowerCase("tr")} ${fmtNum(t[k])}/${fmtNum(L[k])}`);
  p.meals.forEach(m=>{ const ML=mealLimitsOf(p,m), mt=mealTotals(m);
    GKEYS.forEach(k=>{ if(mt[k] > ML[k] + 1e-9) out.push(`${m.name}: ${GROUPS[k].name.toLocaleLowerCase("tr")} ${fmtNum(mt[k])}/${fmtNum(ML[k])}`); }); });
  return out;
}
function giOutside(iid){
  let gi = 0;
  P().meals.forEach(m=>m.items.forEach(it=>{
    if(it.kind!=="ex" || it.id===iid) return;
    portions(it).forEach(x=>{ const f=FOOD[it.group+":"+x.f]; if(f&&f.gi) gi+=x.u; });
  }));
  return gi;
}

/* ---------- swap sheet ---------- */
function findItem(iid){ if(!P()) return null; for(const m of P().meals){ const it=m.items.find(x=>x.id===iid); if(it) return {m,it}; } return null; }
const sumCounts = c => Object.values(c).reduce((a,b)=>a+b,0);
const giOfCounts = (g, c) => Object.entries(c).reduce((a,[fid,u])=>a+(FOOD[g+":"+fid]?.gi?u:0),0);
const giOfList = (g, list) => (list||[]).reduce((a,x)=>a+(FOOD[g+":"+x.f]?.gi?x.u:0),0);
const giFits = (it, c) => giOutside(it.id) + giOfCounts(it.group, c) <= GI_MAX + 1e-9;
// kaydetmeye engel: yalnız bu pencere * meyveyi artırıp sınırı aşıyorsa (gün zaten aşılmışsa başka kalemler kilitlenmesin)
const giSheetOk = (it, c) => giFits(it, c) || giOfCounts(it.group, c) <= giOfList(it.group, portions(it)) + 1e-9;
function openSwap(iid){
  const r = findItem(iid); if(!r) return;
  const counts = {}; portions(r.it).forEach(x=>counts[x.f]=(counts[x.f]||0)+x.u);
  SW = {iid, counts, step: r.it.units % 1 ? .5 : 1, note:"", opener:iid};
  renderSheet(true);
}
function closeSwap(){
  const opener = SW && SW.opener; SW = null; renderSheet();
  if(opener) document.querySelector(`[data-swap="${opener}"]`)?.focus();
}
function giRoom(it){
  // bu kalemde * meyveye ayrılabilecek en fazla porsiyon
  return Math.max(0, GI_MAX - giOutside(it.id) - giOfCounts(it.group, SW.counts));
}
// + : kalem doluysa en çok seçili diğer besinden bir adım düşer, toplam hep aynı kalır
function incPlan(it, fid){
  const f = FOOD[it.group+":"+fid], st = SW.step, base = SW.counts;
  const attempt = donor => {
    const c = {...base};
    if(donor){ c[donor] -= st; if(c[donor] < 1e-9) delete c[donor]; }
    c[fid] = (c[fid]||0) + st;
    if(sumCounts(c) > it.units + 1e-9) return null;
    if(f.gi && !giFits(it, c)) return null;
    return {c, donor};
  };
  if(sumCounts(base) + st <= it.units + 1e-9){ const r = attempt(null); if(r) return r; }
  const donors = Object.entries(base).filter(([k,u])=>k!==fid && u >= st - 1e-9)
    .sort((a,b)=> b[1]-a[1]);
  for(const [k] of donors){ const r = attempt(k); if(r) return r; }
  return null;
}
function sheetFocusKey(){
  const a = document.activeElement; if(!a || !a.closest || !a.closest("#sheet-root")) return null;
  for(const k of ["inc","dec","all","swapreset","swapsave","close"]) if(a.dataset && a.dataset[k]!==undefined) return `[data-${k}="${a.dataset[k]}"]`;
  return null;
}
function renderSheet(opening){
  const root = $("#sheet-root");
  const r = SW && findItem(SW.iid);
  if(!r){ SW = null; root.innerHTML = ""; document.querySelector(".wrap").inert = false; return; }
  const fk = sheetFocusKey();
  const inSheet = !!(document.activeElement && document.activeElement.closest && document.activeElement.closest("#sheet-root"));
  const listTop = opening ? 0 : (root.querySelector(".sheet-b") || {}).scrollTop || 0;
  const {it, m} = r; const G = GROUPS[it.group];
  const used = sumCounts(SW.counts);
  const left = it.units - used;
  const giOk = giSheetOk(it, SW.counts);
  const balanced = Math.abs(left) < 1e-9;
  const segs = Math.max(it.units, used) / SW.step;
  let meter = ""; for(let i=0;i<segs;i++){ const v=(i+1)*SW.step; meter += `<i class="${v<=used+1e-9 ? (v>it.units+1e-9?"over":"on") : ""}"></i>`; }
  const status = !giOk ? `* meyveden günde en fazla ${GI_MAX} porsiyon. * meyveyi azalt.`
    : balanced ? (SW.note || "Tamam, değişimler dengede. + ile başka besin seçersen en çok seçili olandan otomatik düşer.")
    : left > 0 ? `${fmtNum(left)} değişim daha seç.` : `${fmtNum(-left)} değişim fazla.`;
  const ML = mealLimitsOf(P(), m);
  const lim = `Bu kalemde toplam ${fmtNum(it.units)} ${G.name.toLocaleLowerCase("tr")} değişimi sabit kalır.`
    + (ML ? ` ${m.name} öğününde listedeki ${G.name.toLocaleLowerCase("tr")} limiti: ${fmtNum(ML[it.group])}.` : "")
    + (G.foods.some(f=>f.gi) ? ` * işaretli meyveden günde en fazla ${GI_MAX} porsiyon.` : "");
  root.innerHTML = `<div class="scrim" data-close="1"><div class="sheet${opening?" enter":""}" role="dialog" aria-modal="true" aria-label="Değiştir" tabindex="-1" style="--c:${gcolor(it.group)}">
    <div class="sheet-h"><span class="chip" style="--c:${gcolor(it.group)}">${esc(m.name)} · ${G.name}</span>
      <h3>${fmtNum(it.units)} ${G.long}</h3>
      <p>Bir besine dokun: hepsi onunla değişir. Ya da +/− ile birkaç besine böl.${it.orig?` Listede: ${esc(it.orig)}.`:""}</p>
      <div class="meter" aria-hidden="true">${meter}</div>
      <p class="tnum" role="status">${esc(status)}</p>
      <p class="hint">${esc(lim)}</p></div>
    <div class="sheet-b">${G.foods.map(f=>{
      const c = SW.counts[f.id]||0;
      return `<div class="opt ${c?"sel":""}"><div><button class="nm" data-all="${f.id}">${esc(f.name)}${f.gi?' <span style="color:var(--g-meyve)">*</span>':""}</button>
        <div class="sub tnum">1 değişim: ${esc(amount(f,1))}</div>
        ${c?`<div class="cur tnum">Seçili: ${esc(amount(f,c))}</div>`:""}</div>
        <div class="step"><button data-dec="${f.id}" aria-label="${esc(f.name)} azalt" ${c?"":"disabled"}>−</button><output class="tnum">${fmtNum(c)}</output><button data-inc="${f.id}" aria-label="${esc(f.name)} artır" ${incPlan(it,f.id)?"":"disabled"}>+</button></div></div>`;
    }).join("")}</div>
    <div class="sheet-f"><button class="btn ghost" data-swapreset="1">Listedeki haline dön</button>
      <div class="right"><button class="btn" data-close="1">Vazgeç</button><button class="btn primary" data-swapsave="1" ${balanced&&giOk?"":"disabled"}>Kaydet</button></div></div>
  </div></div>`;
  document.querySelector(".wrap").inert = true;
  const list = root.querySelector(".sheet-b"); if(list) list.scrollTop = listTop;   // + / − sonrası liste başa kaçmasın
  const target = (fk && root.querySelector(fk)) || (opening || inSheet || !fk ? root.querySelector(".sheet") : null);
  if(target && !target.disabled) target.focus({preventScroll:true}); else root.querySelector(".sheet").focus({preventScroll:true});
}
function saveSwap(){
  const r = findItem(SW.iid); if(!r){ closeSwap(); return; }
  const {it} = r;
  const sel = Object.entries(SW.counts).filter(([,u])=>u>1e-9).map(([f,u])=>({f,u}));
  if(Math.abs(sumCounts(SW.counts) - it.units) > 1e-9 || !sel.every(x=>FOOD[it.group+":"+x.f])){ toast("Değişimler dengede değil."); return; }
  if(!giSheetOk(it, SW.counts)){ toast(`* meyveden günde en fazla ${GI_MAX} porsiyon.`); return; }
  const same = sel.length===it.def.length && sel.every(x=>it.def.some(d=>d.f===x.f && Math.abs(d.u-x.u)<1e-9));
  it.sel = same ? null : sel;
  const opener = SW.opener; SW = null; renderSheet(); save(); render(); toast("Değişim kaydedildi");
  document.querySelector(`[data-swap="${opener}"]`)?.focus();
}

/* ---------- diyetisyen listesini fotoğraftan / metinden okuma ----------
   Fotoğraftaki yazı telefonda Tesseract (açık kaynak yazı tanıma) ile metne
   çevrilir. Metin bu algoritmayla öğünlere ve değişim kalemlerine ayrılır:
   1) Öğünler başlık (Sabah, Öğle...), saat aralığı ve ayırıcı çizgilerden bulunur;
      başlık okunamadıysa saatten tahmin edilir.
   2) Her satırda miktar + ölçü + besin aranır ("6 yemek kaşığı pilav"), "veya"dan
      sonrası alternatif sayılır.
   3) Besinin değişim tablosundaki 1 değişim ölçüsüyle bölünüp değişim sayısı
      bulunur: pilav 1 değişim = 2 yemek kaşığı → 6 yemek kaşığı = 3 ekmek değişimi.
      Aralıklarda ("6-8 yemek kaşığı") üst sınıra en yakın yarım değişim alınır.
   4) Tanınmayan satırlar serbest kalem olur. Sonuç kaydetmeden önce gösterilir. */
const trLow = x => String(x).toLocaleLowerCase("tr");
const fold = x => trLow(x).replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/[âàá]/g,"a").replace(/[îíì]/g,"i").replace(/[ûúù]/g,"u");
const P_FOODS = [

  ["meyve","kayisi",["taze kayisi","kayisi"]],["meyve","incir",["taze incir","incir"]],["meyve","armut",["armut"]],

  ["ekmek","galeta",["galeta"]],["ekmek","yulaf",["yulaf","yulaf ezme"]],["ekmek","grissini",["grissini"]],
  ["yag","zeytinyagi",["zeytinyag","zeytin yag"]],["yag","zeytin",["zeytin"]],["yag","sivi",["sivi yag","bitkisel yag","aycicek yag"]],

// Türkçe ek: ekmek → ekmeği, yoğurt → yoğurdu, çorba → çorbası, peynir → peyniri, yağ → yağı
function phraseVariants(ph){
  const words = ph.split(" "), last = words.pop(), pre = words.length ? words.join(" ") + " " : "";
  const out = new Set([last]);
  if(/[aeiou]$/.test(last)) ["si","su","yi","yu","lari","leri"].forEach(s=>out.add(last+s));
  else {
    const soft = last.replace(/k$/,"g").replace(/t$/,"d").replace(/p$/,"b").replace(/c$/,"c");
    ["i","u","a","e","lar","ler","lari","leri"].forEach(s=>{ out.add(last+s); if(soft!==last && !/^l/.test(s)) out.add(soft+s); });
  }
  return [...out].map(w=>pre+w);
}
const P_FOOD_RE = P_FOODS.flatMap(([g,id,phs])=>phs.map(ph=>({g, id, ph,
  re: new RegExp("(^|[^a-z])(" + phraseVariants(ph).map(v=>v.replace(/ /g,"\\s+")).join("|") + ")(?=$|[^a-z])", "g")})));
// 1 değişimin tabloda yazmayan ama listelerde sık geçen karşılıkları (tablodaki notlar ve eşdeğer ölçüler)
const P_EQUIV = {
  "sut:yogurt": {"su bardagi":1, "kase":1, "g":200, "ml":200},
  "sut:sut": {"g":200}, "sut:kefir": {"g":200}, "sut:ayran": {"g":400},
  "yag:zeytinyagi": {"ml":5}, "yag:sivi": {"ml":5}
};
// ölçüler: miktarın hemen arkasında aranır
const P_UNITS = [
  ["yemek kasigi",/^\s*\(?\s*(yemek\s+kasig[ia]|yemek\s+kasik|yemek\s+k\b\.?|y\.\s?k\b\.?|yk\b)/],
  ["tatli kasigi",/^\s*\(?\s*(tatli\s+kasig[ia]|tatli\s+kasik|t\.\s?k\b\.?|tk\b)/],
  ["cay kasigi",/^\s*\(?\s*(cay\s+kasig[ia]|cay\s+kasik)/],
  ["cay bardagi",/^\s*\(?\s*(cay\s+bardag[ia]|cay\s+bardak)/],
  ["su bardagi",/^\s*\(?\s*(su\s+bardag[ia]|subardag[ia]|su\s+bardak|s\.\s?b\b\.?|sb\b|bardak\b)/],
  ["ince dilim",/^\s*\(?\s*ince\s+dilim/],["dilim",/^\s*\(?\s*dilim/],
  ["kofte kadar",/^\s*\(?\s*kofte\s+(kadar|buyuklugu(nde)?)/],["kibrit kutusu",/^\s*\(?\s*kibrit\s+kutusu(\s+kadar)?/],
  ["kase",/^\s*\(?\s*(orta\s+|kucuk\s+|buyuk\s+)?(kase|kepce)/],["porsiyon",/^\s*\(?\s*(porsiyon|degisim)/],
  ["boy",/^\s*\(?\s*(kucuk|orta|buyuk)(\s+boy)?\b/],["adet",/^\s*\(?\s*(adet|tane)\b/],["avuc",/^\s*\(?\s*avuc/],
  ["g",/^\s*(g|gr|gram)\b\.?/],["ml",/^\s*(ml|cc)\b\.?/]
];
const P_FREE = /\b(cay|ihlamur|bitki cayi|salata|domates|salatalik|yesillik|marul|roka|maydanoz|biber|tursu|cacik|mevsim|limon|maden suyu|kahve|su)\b(?!\s+(bardag|kasig))/;
const P_MEALS = [
  [/^(sabah|kahvalti)/,"Sabah"],[/^(ara\s+ogun|kusluk)/,"Ara öğün"],[/^(ogle|oglen)/,"Öğle"],[/^ikindi/,"İkindi"],
  [/^aksam/,"Akşam"],[/^(gece|yatmadan|yatarken)/,"Gece"]
];
const P_WORDNUM = {"yarim":.5,"ceyrek":.25,"bir":1,"iki":2,"uc":3,"dort":4,"bes":5,"alti":6,"yedi":7,"sekiz":8,"dokuz":9,"on":10};
const halfRound = x => Math.max(.5, Math.round(x*2)/2);
const halfFloor = x => Math.floor(x*2+1e-9)/2;

function pNum(x){ x = String(x).replace(/\s/g,""); if(x==="½") return .5; if(x==="¼") return .25; if(x==="¾") return .75;
  if(x.includes("/")){ const [a,b] = x.split("/").map(Number); return b ? a/b : NaN; } return parseFloat(x.replace(",", ".")); }
// satırdaki bütün miktarlar: 6-8, 1/2, ½, 1 ½, 1 buçuk, yarım, iki ...
function pQtys(t){
  const out = [], re = /(\d+(?:[.,]\d+)?)\s*(?:bucuk|½|1\/2)(?!\d)|(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?|[½¼¾])(?:\s*[-–—]\s*(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?))?|\b(bir|iki|uc|dort|bes|alti)\s+bucuk\b|\b(yarim|ceyrek|bir|iki|uc|dort|bes|alti|yedi|sekiz|dokuz|on)\b/g;
  let m;
  while((m = re.exec(t))){
    let lo, hi;
    if(m[1]!==undefined){ lo = hi = pNum(m[1]) + .5; }
    else if(m[2]!==undefined){ lo = pNum(m[2]); hi = m[3]!==undefined ? pNum(m[3]) : lo; }
    else if(m[4]!==undefined){ lo = hi = P_WORDNUM[m[4]] + .5; }
    else { lo = hi = P_WORDNUM[m[5]]; }
    if(!(lo > 0)) continue;
    out.push({lo, hi: hi > lo ? hi : lo, start: m.index, end: m.index + m[0].length, word: m[5]!==undefined});
  }
  return out;
}
function pUnitAt(t, pos){ const rest = t.slice(pos); for(const [u,re] of P_UNITS){ const m = re.exec(rest); if(m) return {u, start: pos, end: pos + m[0].length, size: (/(kucuk|orta|buyuk)/.exec(m[0])||[])[1]}; } return null; }
// besin: "/" ile ayrılmış ilk seçenekteki tamlamanın ana ismi (en sonda biten eşleşme)
function pFindFood(t){
  const parts = t.split(/(?<!\d)\s*\/\s*(?!\d)/);
  for(const part of parts){
    let best = null;
    for(const e of P_FOOD_RE){ e.re.lastIndex = 0; let m;
      while((m = e.re.exec(part))){ const at = m.index + m[1].length, end = at + m[2].length;
        if(!best || end > best.end || (end===best.end && m[2].length > best.len)) best = {g:e.g, id:e.id, ph:e.ph, at, end, len:m[2].length}; } }
    if(best) return best;
  }
  return null;
}
function pUnitsFor(g, id, q, unit){
  // miktar, değişim tablosundaki 1 değişim ölçüsüne bölünür; dönen {u, sure}
  const f = FOOD[g+":"+id], fu = fold(f.u), n = Array.isArray(f.n) ? (f.n[0]+f.n[1])/2 : f.n, eq = P_EQUIV[g+":"+id] || {};
  const u = unit && unit.u;
  if(u==="porsiyon") return {u:q, sure:true};
  if(u && eq[u]) return {u:q/eq[u], sure:true};
  if(u==="g") return f.g ? {u:q/f.g, sure:true} : {u:1, sure:false};
  if(u==="ml") return f.ml ? {u:q/f.ml, sure:true} : {u:1, sure:false};
  if(u==="kofte kadar" && g==="et") return {u:q, sure:true};           // köfte kadar et = 1 değişim
  if((u==="dilim"||u==="ince dilim") && ["beyaz","kasar","lightkasar"].includes(id)) return {u:q, sure:true}; // 1 dilim peynir ≈ 1 kibrit kutusu
  const countish = /adet|boy|buyuklu|kadar|parca|dilim/.test(fu);
  if(!u) return {u:q/n, sure: countish && !/dilim/.test(fu)};
  if(u==="boy"){ const fs = (/(kucuk|orta|buyuk)/.exec(fu)||[])[1]; return {u:q/n, sure: /adet|boy/.test(fu) && (!fs || !unit.size || fs===unit.size)}; }
  const same = fu.includes(u) || ((u==="dilim"||u==="ince dilim") && fu.includes("dilim")) || (u==="adet" && /adet|boy|buyuklu|kadar/.test(fu))
    || (u==="kibrit kutusu" && fu.includes("kibrit")) || (u==="kase" && fu.includes("kase"));
  return {u:q/n, sure: !!same};
}
function pTidy(x){
  // BÜYÜK HARF kelimeleri Türkçe kurala göre küçült, baştaki/sondaki okuma çöpünü at
  x = x.replace(/(^|\s)\|(?=\s+[A-Za-zÇĞİÖŞÜçğıöşü])/g,"$11").replace(/[|_~«»“”"=]+/g," ").replace(/\s+/g," ").trim();
  x = x.replace(/(?<![\p{L}])\p{Lu}{2,}(?![\p{L}])/gu, w=>trLow(w));
  x = x.replace(/^[A-Za-zÇĞİÖŞÜçğıöşü]\s+(?=\d)/,"").replace(/^[^\p{L}\d(½¼¾]+/u,"").replace(/\s+[A-Za-zçğıöşü]$/,"").trim();
  return x ? x.charAt(0).toLocaleUpperCase("tr") + x.slice(1) : x;
}
// tek bir "miktar ölçü besin" parçası
function pOne(seg, whole){
  seg = seg.replace(/\btablo\s*\d+[^\s)]*/g, m=>" ".repeat(m.length));
  const paren = []; seg.replace(/\([^)]*\)/g, (m, at)=>{ paren.push([at, at+m.length]); return m; });
  const inParen = x => paren.some(([a,b])=>x.start > a && x.start < b);
  const q = pQtys(seg).filter(x=>!inParen(x) || pUnitAt(seg, x.end));
  const pairs = q.map(x=>({q:x, unit:pUnitAt(seg, x.end)}));
  let body = seg; pairs.forEach(p=>{ if(p.unit) body = body.slice(0,p.unit.start) + " ".repeat(p.unit.end-p.unit.start) + body.slice(p.unit.end); });
  body = body.replace(/\([^)]*\)/g, m=>" ".repeat(m.length));
  let food = pFindFood(body);
  return {q, pairs, food};
}
function pItemFrom(seg, whole, text){
  let {pairs, food} = pOne(seg, whole);
  if(!food && whole){   // ilk seçenek okunamadı ("yoğur!"): okunabilen ilk seçeneği kullan
    for(const alt of whole.split(/\s+(?:veya|ya da|yada)\s+/).slice(1)){ const o = pOne(alt); if(o.food){ ({pairs, food} = o); seg = alt; break; } }
  }
  const f = fold(seg);
  const freeish = P_FREE.test(f.replace(/\([^)]*\)/g," "));
  if(!food || (freeish && food.ph.length<=3)) return {kind:"free", text, orig:text};
  // "Pilav veya makarna 6 yemek kaşığı": miktar seçeneklerden sonra yazılmış olabilir
  let use = pairs;
  if(!use.length && whole){ use = pOne(whole).pairs; }
  if(!use.length) return {kind:"free", text, orig:text, check:true};   // miktarsız besin: değişim uydurma
  // besinle uyumlu ölçüsü olan ilk miktar; yoksa ölçüsü olan ilk; yoksa ilk
  const scored = use.map(p=>({p, r:pUnitsFor(food.g, food.id, p.q.lo, p.unit)}));
  const pick = scored.find(x=>x.p.unit && x.r.sure) || scored.find(x=>x.p.unit && !x.p.q.word) || scored.find(x=>x.p.unit) || scored[0];
  const a = pick.r, b = pUnitsFor(food.g, food.id, pick.p.q.hi, pick.p.unit), q = pick.p.q;
  let units = q.hi > q.lo ? (halfFloor(b.u) >= a.u - 1e-9 ? halfFloor(b.u) : halfRound((a.u+b.u)/2)) : halfRound(a.u);
  let sure = a.sure && b.sure && (q.hi > q.lo || Math.abs(units - a.u) < .15);
  if(units > 12){ units = 12; sure = false; }   // mantıksız büyük sayı: okuma hatası, kontrol ettir
  return {kind:"ex", group:food.g, food:food.id, units, orig:text, check:!sure};
}
function pItems(raw){
  const text = pTidy(raw);
  const t = fold(text).replace(/(^|\s)[|!l](?=\s+[a-z])/g,"$11");   // "| su bardağı" → "1 su bardağı"
  const main = t.split(/\s+(?:veya|ya da|yada)\s+/)[0];

  if(P_MEALS.some(([re])=>re.test(f.replace(/^\d+\s*[.)-]?\s*/,""))) || /\d{1,2}[.:,]\d{2}/.test(x)) return false;

const SEP_LEAD = /^\s*(?:[—_=~*•·-]\s*){2,}/, SEP_TRAIL = /(?:\s*[—_=~*•·-]){2,}\s*$/;

  /(\d{1,2})[.:,](\d{2})\s*[-–—]\s*(\d{1,2})[.:,](\d{2})/,
  /(?:^|[^\d])[.:,](\d{2})\s*[-–—]\s*(\d{1,2})[.:,](\d{2})/,          // baş saati okunamamış: ".00-21.30"
  /\b([01]\d|2[0-3])([0-5]\d)\s*[-–—:]\s*([01]\d|2[0-3])([0-5]\d)\b/    // noktasız: "1700-1730", "2100:2130"

function pTime(line){

    if(k===1){ h2 = +m[2]; m2 = +m[3]; const e = h2*60 + m2 - 30; h1 = Math.floor((e+1440)%1440/60); m1 = (e+1440)%60; }   // pencere 30 dk sayılır
    else { h1 = +m[1]; m1 = +m[2]; h2 = +m[3]; m2 = +m[4]; }

    if(h1>23 || h2>23 || m1>59 || m2>59) return {time:"", rest:line, bad:false};
    const d = (h2*60+m2) - (h1*60+m1);

function pHeader(line){

  for(const [re, name] of P_MEALS){

    const tail = /^(?:u|i|leri)?(?:\s+(?:yemegi|yemek|kahvaltisi|ogunu|ogun|once|oncesi))?(?![a-z])/.exec(f.slice(len));

    len += tail[0].length;
    return {name: (lead[1] && name==="Ara öğün" ? lead[1] + ". " : "") + name, rest: rest.slice(len).replace(/^[\s:.,-]+/,"")};

  const setTime = t => { if(!cur) open(); cur.time = t; cur.timeFirst = !cur.items.length; };

        const its = (line.match(/\p{L}/gu)||[]).length >= 3 ? pItems(line) : [];

      }
    }
    if(wasAlt && !hdr && !time) continue;                         // önceki satırın "veya"sından sonraki seçenek
    if(/^(veya|ya da|yada)\b/i.test(fold(line)) && !hdr){ continue; }
    if(hdr){
      if(!cur || cur.name || (cur.time && cur.timeFirst && cur.items.length)) open();

      if(pendingTime && !time){ cur.time = pendingTime; cur.timeFirst = true; }
      pendingTime = "";
      if(pre.length){ cur.items.push(...pre); pre = []; }
    }
    if(time){
      const f = fold(line);
      const alone = !hdr && (f.match(/[a-z]/g)||[]).length < 3;
      if(hdr){ if(!cur.time){ cur.time = time; cur.timeFirst = !cur.items.length; } }
      else if(alone && cur && cur.items.length && cur.time){ pendingTime = time; continue; }   // saati olan öğünden sonra gelen tek saat: bir sonraki başlığın
      else if(!cur || (cur.time && cur.time!==time)) { open(); setTime(time); }

    }
    if(pendingTime && !hdr){ if(!cur || cur.time) open(); setTime(pendingTime); pendingTime = ""; }
    if(pre.length){ (cur||open()).items.push(...pre); pre = []; }
    let f = fold(line);
    if(/\bspor\s+sonrasi\b/.test(f)){ (cur||open()).spor = true; line = line.replace(/spor\s+sonras[ıi]/i,"").trim(); f = fold(line); }

  }
  if(pendingTime && cur && !cur.time) cur.time = pendingTime;
  const nameFromTime = t => { const h = parseInt(t,10); return isNaN(h) ? "" : h < 11 ? "Sabah" : h < 16 ? "Öğle" : h < 20 ? "Akşam" : "Gece"; };

    name: (m.name || nameFromTime(m.time) || `Öğün ${i+1}`) + (m.spor ? " · spor sonrası" : ""),

}

let tessLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessLoading) tessLoading = new Promise((res, rej)=>{ const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";
    sc.onload = res; sc.onerror = ()=>{ tessLoading = null; rej(new Error("yuklenemedi")); }; document.head.appendChild(sc); });

function parseScore(meals){
  // doğruluk bilinmeden kıyas: saatli/adlı öğün ve tabloyla eşleşen kalem artı, işaretli kalem eksi
  let sc = 0;
  meals.forEach(m=>{ if(m.time) sc += 2; if(!/^Öğün \d/.test(m.name)) sc += 1;
    m.items.forEach(it=>{ sc += it.kind==="ex" ? (it.check ? .5 : 2) : (it.check ? -1 : .3); }); });

}
async function prepImage(file, stretch){

    const img = new Image(); await new Promise((r,j)=>{ img.onload=r; img.onerror=j; img.src=url; });

    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
    let lo = 255, hi = 0; for(let i=0;i<px.length;i+=4){ const v = .299*px[i]+.587*px[i+1]+.114*px[i+2]; px[i]=v; if(v<lo) lo=v; if(v>hi) hi=v; }

  } finally { URL.revokeObjectURL(url); }
}
// fotoğraf kalitesi: eğim (satır tabanlarının açısı), ışık (kağıdın bölge bölge parlaklığı), okunamayan satırlar (düşük güven)

function photoQuality(data, gray, canvas, seen){

}
function impProgress(){ const el = $("#impprog"); if(el && IMP){ el.value = IMP.progress||0; } const m = $("#impmsg"); if(m && IMP) m.textContent = IMP.msg||""; }
async function runImport(files){

  const run = IMP = {phase:"ocr", progress:0, msg:"Yazı tanıma yükleniyor…", text:"", meals:[]}; TAB = TAB==="edit" ? "edit" : "menu"; render();
  const alive = () => IMP === run;

      try{ const seen = new Set(); parseDietText(best.t, null, seen); const q = photoQuality(best.data, gray, best.c, seen); if(q.none || q.skew || q.light || q.badAll.length) quality.push({...q, photo:i+1}); }catch(e){}
    }

    run.text = text; run.quality = quality; run.photos = n; run.meals = parseDietText(text, impBad(run)); run.phase = "review";

}

  const uopts = u => [...new Set([...IMP_UNITS, u])].sort((a,b)=>a-b).map(n=>`<option value="${n}" ${n===u?"selected":""}>× ${fmtNum(n)}</option>`).join("");
  const checks = IMP.meals.reduce((a,m)=>a+m.items.filter(it=>it.check && !it.unread).length,0);
  const unread = IMP.meals.reduce((a,m)=>a+m.items.filter(it=>it.unread).length,0);
  const qs = IMP.quality||[], qimg = b=>`<img src="${b.src}" alt="Okunamayan satır: fotoğraftaki hali" loading="lazy">`;
  const qwarn = qs.length ? `<div class="qwarn"><b>Fotoğraf${IMP.photos>1?"lar":""} tam okunamadı</b>${qs.map(q=>`<div class="qphoto">${IMP.photos>1?`<span class="qnum">Fotoğraf ${q.photo}</span>`:""}<ul>
      ${q.none?`<li>Fotoğraftaki yazının çoğu okunamadı.</li>`:""}
      ${q.skew?`<li>Fotoğraf eğik ya da kağıt kıvrık (yaklaşık ${q.skew}°). Satırlar kayınca yazılar birbirine karışıyor.</li>`:""}
      ${q.light?`<li>Kağıtta ışık eşit değil: bazı yerler parlıyor, bazı yerler gölgede. Parlayan ya da gölgede kalan kısımlar okunamıyor.</li>`:""}
      ${q.badAll.length?`<li>${q.badAll.length} satır okunamadı.${q.bad.length?` Fotoğraftaki hali${q.badAll.length>q.bad.length?` (ilk ${q.bad.length} tanesi)`:""}:`:""}</li>`:""}</ul>
      ${q.bad.length?`<div class="qcrops">${q.bad.slice(0,3).map(qimg).join("")}</div>${q.bad.length>3?`<details class="qmore" data-qphoto="${q.photo}" ${IMP.qopen&&IMP.qopen[q.photo]?"open":""}><summary>Diğer ${q.bad.length-3} satırı gör</summary><div class="qcrops">${q.bad.slice(3).map(qimg).join("")}</div></details>`:""}`:""}</div>`).join("")}
    <p>Daha iyi sonuç için kağıdı düz bir yere koy, telefonu tam üstünden tut ve ışık kağıtta parlamasın; sonra yeniden çek. Ya da aşağıdaki sarı kalemleri fotoğrafa bakarak düzelt.</p>
    <div class="row"><button class="btn" data-imp="start">Yeniden fotoğraf çek</button></div></div>` : "";
  const giImp = IMP.meals.reduce((a,m)=>a+m.items.reduce((b,it)=>b+(it.kind==="ex" && FOOD[it.group+":"+it.food]?.gi ? it.units : 0),0),0);
  let h = `<div class="form"><div class="card"><h2>Okunan liste</h2>
    <p class="hint">Fotoğraftan çıkarılan öğünler ve değişim sayıları. Yanlış okunanı düzelt, sonra kaydet. Kaydedilen liste limitin olur; değişimler bu sayılarla yapılır.</p>
    ${qwarn}
    ${unread?`<p class="alert" id="impunread">${unread} kalem okunamayan satırdan geldi, sarı işaretli. Fotoğrafa bakıp düzelt.</p>`:""}
    ${checks?`<p class="alert">${checks} kalem tabloyla tam eşleşmedi, sarı işaretli. Kontrol et.</p>`:""}
    ${giImp > GI_MAX + 1e-9 ? `<p class="alert">Listede * işaretli meyve toplam ${fmtNum(giImp)} porsiyon; kurala göre günde en fazla ${GI_MAX}. Birini başka meyveyle değiştir.</p>`:""}
    ${IMP.meals.length?"":`<p class="alert">Listede öğün bulunamadı. Metni kontrol edip “Metinden oku”ya bas.</p>`}</div>`;
  IMP.meals.forEach((m,mi)=>{
    h += `<section class="meal"><div class="emeal-h"><input type="text" id="imn-${mi}" data-impmeal="${mi}" value="${esc(m.name)}" aria-label="Öğün adı"><input type="text" id="imt-${mi}" data-imptime="${mi}" value="${esc(m.time)}" placeholder="Saat" aria-label="Saat"></div>`;
    m.items.forEach((it,ii)=>{
      const k = mi+"-"+ii;
      h += `<div class="improw ${it.check?"check":""}"><div class="impc ${it.kind==="free"?"free":""}">
        <select id="ig-${k}" data-impg="${k}" aria-label="Grup">${gopts(it.kind==="free"?"free":it.group)}</select>
        ${it.kind==="free" ? `<input type="text" id="itx-${k}" data-imptx="${k}" value="${esc(it.text)}" aria-label="Metin">`
          : `<select id="iu-${k}" data-impu="${k}" aria-label="Değişim">${uopts(it.units)}</select>
             <select id="if-${k}" data-impf="${k}" aria-label="Besin">${GROUPS[it.group].foods.map(f=>`<option value="${f.id}" ${f.id===it.food?"selected":""}>${esc(f.name)}</option>`).join("")}</select>`}
        <button class="btn ghost danger" data-impdel="${k}" aria-label="Kalemi çıkar">Çıkar</button></div>
        <div class="hint">${it.unread?"Okunamadı, fotoğrafa bakıp düzelt. Okunan: ":"Listede: "}${esc(it.orig||it.text||"")}${it.kind==="ex"?` → ${esc(amount(FOOD[it.group+":"+it.food], it.units))}`:""}</div></div>`;
    });
    h += `</section>`;
  });
  h += `<details class="card"><summary>Okunan metni gör / düzelt</summary>${textBox}</details>
    <div class="row"><button class="btn primary" data-imp="save" ${IMP.meals.some(m=>m.items.some(it=>it.kind==="ex"))?"":"disabled"}>${confirmKey==="imp"?"Emin misin? Mevcut listenin yerine geçer":"Listeyi kaydet"}</button><button class="btn ghost" data-imp="cancel">Vazgeç</button></div></div>`;
  return h;
}
function cloneMeals(meals){
  return JSON.parse(JSON.stringify(meals)).map(m=>({...m, id:nid("m"), items:m.items.map(it=>({...it, id:nid(), sel:null}))}));
}
function saveImport(){
  const meals = IMP.meals.filter(m=>m.items.length).map((m,i)=>({id:nid("m"), key:"m"+(i+1), name:m.name.trim()||`Öğün ${i+1}`, time:m.time.trim(),
    items:m.items.map(it=> it.kind==="free" ? fr(it.text) : ex(it.group, it.units, it.food, it.orig))}));
  if(!ME) ME = {name:(USER.email||"").split("@")[0] || "Profilim", meals:[], log:{}};
  ME.diet = {meals: JSON.parse(JSON.stringify(meals)), at: Date.now()};
  ME.meals = cloneMeals(meals);
  delete ME.plan;
  IMP = null; confirmKey = null; migrateProfile(ME); save(); TAB = "menu"; render(); toast("Diyetisyen listesi kaydedildi");
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("button, .scrim"); if(!b) return;
  const d = b.dataset;
  if(b.classList.contains("scrim") && e.target!==b) return;
  if(d.close){ closeSwap(); return; }
  if(d.imp){
    if(d.imp==="start"){ const fi=$("#impfile"); fi.value=""; fi.click(); return; }
    if(d.imp==="text"){ IMP = {phase:"text", text:"", meals:[]}; render(); return; }
    if(d.imp==="cancel"){ if(IMP && IMP.worker) IMP.worker.terminate().catch(()=>{}); IMP = null; confirmKey = null; render(); return; }
    if(d.imp==="parse"){ const t = ($("#imptext")||{}).value||""; const q = IMP&&IMP.quality; IMP = {phase:"review", text:t, meals:parseDietText(t, impBad(IMP)), quality:q, photos:IMP&&IMP.photos, qopen:IMP&&IMP.qopen}; confirmKey=null; render(); return; }
    if(d.imp==="save"){
      if(ME && ME.meals.length && confirmKey!=="imp"){ confirmKey="imp"; render(); return; }
      if(ME){ saveImport(); return; }
      // ilk giriş: başka cihazda liste oluşturulduysa önce onu göster
      const u = USER;
      fsdb.collection("users").doc(u.uid).get().then(snap=>{
        if(USER!==u) return;
        const remote = snap.exists ? readProfile((snap.data()||{}).json) : null;
        if(remote){ ME = remote; migrateProfile(ME); confirmKey="imp"; render(); toast("Bu hesapta zaten bir liste var. Yine de kaydedersen yerine geçer."); return; }
        saveImport();
      }).catch(()=>{ if(USER===u) toast("Bağlanılamadı. İnternet bağlantını kontrol et."); });
      return;
    }
    return;
  }
  if(d.impdel){ const [mi,ii]=d.impdel.split("-").map(Number); IMP.meals[mi].items.splice(ii,1); render(); return; }
  if(d.authmode){ AUTH_EMAIL = ($("#aemail")||{}).value || AUTH_EMAIL; AUTH_MODE=d.authmode; render(); return; }
  if(d.onboard){
    const nm = (($("#oname")||{}).value||"").trim(), u = USER, choice = d.onboard;
    fsdb.collection("users").doc(u.uid).get().then(snap=>{
      if(USER!==u) return;
      const remote = snap.exists ? readProfile((snap.data()||{}).json) : null;
      if(remote){ ME = remote; migrateProfile(ME); render(); toast("Bu hesapta zaten bir liste var, o yüklendi."); return; }
      onboard(choice, nm);
    }).catch(()=>{ if(USER===u) toast("Bağlanılamadı. İnternet bağlantını kontrol et."); });
    return;
  }
  if(d.act==="signout"){
    if(SIGNING_OUT) return;
    const u = USER; SIGNING_OUT = true; SW = null; renderSheet(); render();
    flushSave().then(ok=>{
      // kaydedilemediyse tek kopya bu cihazda; silme, tekrar girince hesaba yüklenir
      if(ok){ try{ localStorage.removeItem(cacheKey(u)); }catch(e){} }
      else toast("İnternet yok: son değişikliklerin bu cihazda saklandı, tekrar girince hesabına yüklenecek.");
      auth.signOut();
    });
    return;
  }
  if(d.act==="retry"){ if(USER) loadMe(USER); return; }
  if(d.act==="resetpass"){
    const em = (($("#aemail")||{}).value||"").trim();
    if(!em){ showAuthErr("Önce e-posta adresini yaz."); return; }
    auth.sendPasswordResetEmail(em).then(()=>{ showAuthErr(""); toast("Şifre sıfırlama e-postası gönderildi"); }).catch(e=>showAuthErr(authError(e)));
    return;
  }
  if(d.tab){ TAB=d.tab; confirmKey=null; try{localStorage.setItem("degisim-tab",TAB)}catch(e){} render(); return; }
  if(d.go){ TAB=d.go; render(); return; }
  if(d.gtab){ GTAB=d.gtab; render(); return; }
  if(d.check){ const k=todayKey(); const p=P(); p.log={[k]:p.log[k]||{}}; p.log[k][d.check]=!p.log[k][d.check]; if(!p.log[k][d.check]) delete p.log[k][d.check]; save(); render(); return; }
  if(d.swap){ openSwap(d.swap); return; }
  if(d.all!==undefined || d.inc || d.dec || d.swapreset || d.swapsave){ if(!SW || !findItem(SW.iid)){ closeSwap(); return; } }
  if(d.all){
    const {it}=findItem(SW.iid); const f=FOOD[it.group+":"+d.all];
    SW.counts={}; SW.note="";
    const u = f.gi ? Math.min(it.units, Math.floor(giRoom(it)/SW.step+1e-9)*SW.step) : it.units;
    if(u>0) SW.counts[d.all]=u;
    const room = giRoom(it);
    if(u<it.units) toast(u>0 ? `* meyveden günde en fazla ${GI_MAX} porsiyon. Kalanı başka meyveden seç.` : room > 1e-9 ? `Bugün * meyveden ${fmtNum(room)} porsiyon hakkın kaldı; bu kalem ${fmtNum(SW.step)} porsiyonluk adımlarla değişir. Başka meyve seç.` : `* meyve hakkın bugün doldu. Başka meyve seç.`);
    renderSheet(); return;
  }
  if(d.inc){
    const {it}=findItem(SW.iid); const r=incPlan(it, d.inc);
    if(!r){ toast(FOOD[it.group+":"+d.inc]?.gi ? `* meyveden günde en fazla ${GI_MAX} porsiyon.` : "Artırılamıyor."); return; }
    SW.counts = r.c;
    SW.note = r.donor ? `${FOOD[it.group+":"+r.donor].name} ${fmtNum(SW.step)} azaldı, ${FOOD[it.group+":"+d.inc].name} ${fmtNum(SW.step)} arttı. Toplam aynı.` : "";
    renderSheet(); return;
  }
  if(d.dec){ SW.counts[d.dec]=Math.max(0,(SW.counts[d.dec]||0)-SW.step); if(SW.counts[d.dec]<1e-9) delete SW.counts[d.dec]; SW.note=""; renderSheet(); return; }
  if(d.swapreset){
    const {it}=findItem(SW.iid); SW.counts={}; SW.note="";
    let room = Math.max(0, GI_MAX - giOutside(it.id)), cut = false;
    it.def.forEach(x=>{ let u = x.u; if(FOOD[it.group+":"+x.f]?.gi){ const ok = Math.min(u, Math.floor(room/SW.step+1e-9)*SW.step); if(ok<u) cut=true; u=ok; room-=u; } if(u>0) SW.counts[x.f]=(SW.counts[x.f]||0)+u; });
    if(cut) toast(`* meyve hakkı dolu. Eksik kalanı başka meyveden seç.`);
    renderSheet(); return;
  }
  if(d.swapsave){ saveSwap(); return; }
  if(d.delitem){ const [mid,iid]=d.delitem.split("|"); const m=P().meals.find(x=>x.id===mid); m.items=m.items.filter(x=>x.id!==iid); save(); render(); return; }
  if(d.additem){
    const mid=d.additem, g=$("#ag-"+mid).value, u=parseFloat($("#au-"+mid).value), fv=$("#af-"+mid).value.trim();
    const m=P().meals.find(x=>x.id===mid);
    if(g==="free"){ if(!fv){ toast("Önce metni yaz"); return; } m.items.push(fr(fv)); }
    else {
      const L=limitsOf(P()), {t,gi}=totals(P()), ML=mealLimitsOf(P(),m);
      if(ML){ const room=ML[g]-mealTotals(m)[g]; if(u > room+1e-9){ toast(room>1e-9 ? `${m.name} öğününde ${GROUPS[g].name.toLocaleLowerCase("tr")} için en fazla ${fmtNum(room)} değişim ekleyebilirsin.` : m.key && ML[g] <= 1e-9 ? `Diyetisyen listesinde ${m.name} öğününde ${GROUPS[g].name.toLocaleLowerCase("tr")} yok; bu öğüne eklenemez.` : m.key ? `${m.name} öğününde ${GROUPS[g].name.toLocaleLowerCase("tr")} limiti (${fmtNum(ML[g])}) dolu. Önce bu öğünden bir kalemi sil.` : `Bu öğün diyetisyen listesinde yok; sadece serbest kalem eklenebilir.`); return; } }
      if(L && t[g]+u > L[g]+1e-9){ const room=L[g]-t[g]; toast(room>0 ? `Günlük ${GROUPS[g].name.toLocaleLowerCase("tr")} limiti ${fmtNum(L[g])}. En fazla ${fmtNum(room)} değişim ekleyebilirsin.` : `Günlük ${GROUPS[g].name.toLocaleLowerCase("tr")} limiti (${fmtNum(L[g])}) dolu. Önce başka bir kalemi sil.`); return; }
      if(FOOD[g+":"+fv]?.gi && gi+u > GI_MAX+1e-9){ toast(`* meyveden günde en fazla ${GI_MAX} porsiyon.`); return; }
      m.items.push(ex(g,u,fv));
    }
    save(); render(); toast("Eklendi"); return;
  }
  if(d.act==="addmeal"){ P().meals.push({id:nid("m"),name:"Yeni öğün",time:"",items:[]}); save(); render(); return; }
  if(d.act==="reset"){ if(!isLocked(P())) return; if(P().meals.length && confirmKey!=="reset"){ confirmKey="reset"; render(); return; } P().meals=cloneMeals(P().diet.meals); confirmKey=null; save(); render(); toast("Diyetisyen listesine dönüldü"); return; }
  if(d.act==="clearswaps"){
    let skipped = 0;
    P().meals.forEach(m=>m.items.forEach(it=>{
      if(it.kind!=="ex" || !it.sel) return;
      if(giOutside(it.id) + giOfList(it.group, it.def) > GI_MAX + 1e-9){ skipped++; return; }
      it.sel = null;
    }));
    save(); render(); toast(skipped ? `Değişimler geri alındı; * meyve sınırı yüzünden ${skipped} kalem değişik kaldı.` : "Tüm değişimler geri alındı"); return;
  }
});
document.addEventListener("input", e=>{
  const t = e.target; if(!IMP || !IMP.meals || !t.dataset || !t.dataset.imptx) return;
  const [mi,ii] = t.dataset.imptx.split("-").map(Number), it = IMP.meals[mi] && IMP.meals[mi].items[ii]; if(!it) return;
  it.text = t.value; if(!it.unread) return;
  it.check = it.unread = false;
  const row = t.closest(".improw"); if(row){ row.classList.remove("check"); const hn = row.querySelector(".hint"); if(hn) hn.textContent = "Listede: " + (it.orig||it.text||""); }
  const n = IMP.meals.reduce((a,m)=>a+m.items.filter(x=>x.unread).length,0), al = $("#impunread");
  if(al){ if(n) al.textContent = `${n} kalem okunamayan satırdan geldi, sarı işaretli. Fotoğrafa bakıp düzelt.`; else al.remove(); }
});
// "Diğer satırları gör" açık kalsın: düzenlemeler ekranı yeniden çizer
document.addEventListener("toggle", e=>{ const d = e.target; if(IMP && d.classList && d.classList.contains("qmore")) (IMP.qopen = IMP.qopen||{})[d.dataset.qphoto] = d.open; }, true);
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="impfile"){ const files=[...t.files]; if(files.length) runImport(files); return; }
  if(IMP && IMP.meals){
    const k = t.dataset.impg||t.dataset.impu||t.dataset.impf||t.dataset.imptx;
    if(t.dataset.impmeal){ IMP.meals[+t.dataset.impmeal].name = t.value; return; }
    if(t.dataset.imptime){ IMP.meals[+t.dataset.imptime].time = t.value; return; }
    if(k){ const [mi,ii]=k.split("-").map(Number); const it = IMP.meals[mi].items[ii];
      if(t.dataset.impg){ if(t.value==="free"){ Object.assign(it,{kind:"free", text:it.orig||""}); } else { Object.assign(it,{kind:"ex", group:t.value, food:GROUPS[t.value].foods[0].id, units:it.units||1}); } it.check=it.unread=false; render(); }
      else if(t.dataset.impu){ it.units = parseFloat(t.value); it.check=it.unread=false; render(); }
      else if(t.dataset.impf){ it.food = t.value; it.check=it.unread=false; render(); }
      else if(t.dataset.imptx){ it.text = t.value; }
      return; }
  }
  if(!P()) return;
  if(t.id==="pname"){ P().name = t.value.trim() || "Profil"; save(); render(); }
  else if(t.id==="pfull"){ P().fullName = t.value.trim(); save(); }
  else if(t.id==="psrc"){ P().source = t.value.trim(); save(); }
  else if(t.dataset.mname){ P().meals.find(m=>m.id===t.dataset.mname).name=t.value; save(); }
  else if(t.dataset.mtime){ P().meals.find(m=>m.id===t.dataset.mtime).time=t.value; save(); }
  else if(t.dataset.addgroup){ $("#af-wrap-"+t.dataset.addgroup).innerHTML = foodSelect(t.dataset.addgroup, t.value); }
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="authform") return;
  e.preventDefault();
  const em = $("#aemail").value.trim(), pw = $("#apass").value, up = AUTH_MODE==="signup";
  AUTH_EMAIL = em;
  if(!em || !pw){ showAuthErr("E-posta ve şifreyi yaz."); return; }
  if(up && pw.length < 6){ showAuthErr("Şifre en az 6 karakter olmalı."); return; }
  if(up && pw !== $("#apass2").value){ showAuthErr("Şifreler aynı değil."); return; }
  const btn = $("#asubmit"); btn.disabled = true; showAuthErr("");
  (up ? auth.createUserWithEmailAndPassword(em, pw) : auth.signInWithEmailAndPassword(em, pw))
    .catch(err=>{ showAuthErr(authError(err)); btn.disabled = false; });
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && SW){ closeSwap(); return; }
  // giriş formunda Enter her klavyede formu göndersin
  if(e.key==="Enter" && e.target.closest && e.target.closest("#authform") && e.target.tagName==="INPUT"){ e.preventDefault(); const f=$("#authform"); if(!$("#asubmit").disabled) f.requestSubmit(); }
});

render();
</script>
