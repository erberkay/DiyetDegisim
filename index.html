<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diyet Listem</title>
<meta name="description" content="Diyet Listem artık bir iOS uygulaması. Diyetisyeninin değişim listesini iPhone'unda takip et.">
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --ink: #1d2a24; --muted: #5d6b64; --bg: #f6f8f6; --card: #ffffff; --line: #dfe6e1; --accent: #2f7d5b; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8efea; --muted: #9fb0a7; --bg: #111614; --card: #1a211e; --line: #2b3530; --accent: #6cc59b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
         background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { width: 100%; max-width: 30rem; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 .4em; text-wrap: balance; }
  p { margin: 0 0 1em; color: var(--muted); }
  .store { display: inline-block; margin: .4em 0 1.4em; padding: 12px 20px; border-radius: 12px;
           background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  .store:focus-visible, footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  footer { border-top: 1px solid var(--line); padding-top: 1em; font-size: .9rem; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Diyet Listem artık bir iOS uygulaması</h1>
  <p>Diyetisyeninin verdiği değişim listesini iPhone'unda takip et: öğünlerin, saatlerin ve değişimlerin hep yanında.
     Bu sitedeki web sürümü kapatıldı; uygulamaya aynı e-posta ve şifreyle giriş yapabilirsin.</p>
  <a class="store" href="https://apps.apple.com/tr/app/diyet-listem/id6815866712">App Store'dan indir</a>
  <footer><a href="privacy.html">Gizlilik Politikası</a></footer>
</main>
</body>
</html>
